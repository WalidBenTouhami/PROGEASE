<form [formGroup]="livrableForm" (ngSubmit)="onSubmit()" aria-labelledby="formulaire-livrable-titre" class="form-container">
  <h2 id="formulaire-livrable-titre">Ajouter ou modifier un livrable</h2>

  <div class="form-group">
    <label for="nom">Titre du livrable</label>
    <input id="nom" formControlName="nom" type="text" required aria-required="true">
    <div *ngIf="livrableForm.get('nom')?.invalid && livrableForm.get('nom')?.touched" class="error">
      Le titre est requis.
    </div>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="4" required aria-required="true"></textarea>
    <div *ngIf="livrableForm.get('description')?.invalid && livrableForm.get('description')?.touched" class="error">
      La description est requise.
    </div>
  </div>

  <div class="form-group">
    <label for="dateLimite">Date limite</label>
    <input id="dateLimite" formControlName="dateLimite" type="date" required aria-required="true">
  </div>

  <div class="form-group">
    <label for="urlDepot">URL de dépôt</label>
    <input id="urlDepot" formControlName="urlDepot" type="url" required aria-required="true">
  </div>

  <div class="form-group">
    <label for="statut">Statut</label>
    <select id="statut" formControlName="statut" required aria-required="true">
      <option *ngFor="let statut of statutsLivrable" [value]="statut">{{ statut }}</option>
    </select>
  </div>

  <button type="submit" [disabled]="livrableForm.invalid">Enregistrer</button>
</form>
