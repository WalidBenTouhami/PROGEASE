<section class="dashboard-container" aria-labelledby="backoffice-dashboard-title">
  <h2 id="backoffice-dashboard-title" class="title">Tableau de bord enseignant</h2>

  <div class="stats-grid" role="list" aria-label="Statistiques de gestion">
    <div class="stat-card" role="listitem">
      <h3>Projets à valider</h3>
      <span class="stat-value">{{ toValidateProjects }}</span>
    </div>
    <div class="stat-card" role="listitem">
      <h3>Livrables à corriger</h3>
      <span class="stat-value">{{ toCheckDeliverables }}</span>
    </div>
    <div class="stat-card" role="listitem">
      <h3>Étudiants inscrits</h3>
      <span class="stat-value">{{ studentCount }}</span>
    </div>
  </div>

  <section aria-labelledby="recent-admin-title">
    <h3 id="recent-admin-title">Dernières actions</h3>
    <ul>
      <li *ngFor="let action of recentActions">
        {{ action.description }}
        <time [attr.datetime]="action.date">{{ action.date | date:'shortDate' }}</time>
      </li>
    </ul>
  </section>
</section>
