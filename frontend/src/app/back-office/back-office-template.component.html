<mat-sidenav-container class="backoffice-layout">
  <mat-sidenav #sidenav mode="side" opened class="bo-sidebar">
    <mat-toolbar color="primary" class="bo-toolbar">PROGEASE</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/back-office/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon> Dashboard
      </a>
      <a mat-list-item routerLink="/back-office/projet-management" routerLinkActive="active">
        <mat-icon>assignment</mat-icon> Gestion Projets
      </a>
      <a mat-list-item routerLink="/back-office/livrable-management" routerLinkActive="active">
        <mat-icon>fact_check</mat-icon> Gestion Livrables
      </a>
      <a mat-list-item routerLink="/back-office/users" routerLinkActive="active">
        <mat-icon>group</mat-icon> Utilisateurs
      </a>
      <a mat-list-item routerLink="/back-office/settings" routerLinkActive="active">
        <mat-icon>settings</mat-icon> Paramètres
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="bo-header">
      <button mat-icon-button (click)="sidenav.toggle()" class="hide-desktop"><mat-icon>menu</mat-icon></button>
      <img src="assets/PROGEASE.png" alt="PROGEASE Logo" class="bo-logo" />
      <span class="bo-title">PROGEASE Back-Office</span>
      <span class="spacer"></span>
      <button mat-button><mat-icon>account_circle</mat-icon> Profil</button>
      <button mat-button color="warn"><mat-icon>logout</mat-icon> Déconnexion</button>
    </mat-toolbar>
    <main class="bo-main">
      <router-outlet></router-outlet>
    </main>
    <footer class="bo-footer">
      &copy; {{ new Date().getFullYear() }} PROGEASE - Back-Office
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
