<mat-card>
  <h2>Gestion des utilisateurs</h2>
  <mat-form-field appearance="outline" style="width: 250px; margin-right: 1rem;">
    <mat-label>Rechercher un utilisateur...</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Nom ou email">
  </mat-form-field>
  <mat-form-field appearance="outline" style="width: 180px;">
    <mat-label>Rôle</mat-label>
    <mat-select [(ngModel)]="selectedRole">
      <mat-option value="">Tous</mat-option>
      <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
    </mat-select>
  </mat-form-field>

  <table mat-table [dataSource]="utilisateursFiltres" class="mat-elevation-z2" *ngIf="utilisateursFiltres.length">
    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let user">{{ user.nom }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Rôle</th>
      <td mat-cell *matCellDef="let user">{{ user.role }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button color="primary" aria-label="Éditer"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" aria-label="Supprimer"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <p *ngIf="utilisateursFiltres.length === 0">Aucun utilisateur trouvé.</p>
</mat-card>
