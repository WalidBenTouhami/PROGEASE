<div class="container mt-4">
  <h2 class="mb-4">Modifier utilisateur</h2>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="nom" class="form-label">Nom</label>
      <input id="nom" formControlName="nom" type="text" class="form-control" [ngClass]="{'is-invalid': userForm.get('nom')?.invalid && userForm.get('nom')?.touched}">
      <div class="invalid-feedback">
        Nom requis.
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" formControlName="email" type="email" class="form-control" [ngClass]="{'is-invalid': userForm.get('email')?.invalid && userForm.get('email')?.touched}">
      <div class="invalid-feedback">
        Email invalide.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label d-block">Rôle</label>
    <div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" id="roleStudent" formControlName="role" value="student">
  <label class="form-check-label" for="roleStudent">Étudiant</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" id="roleTutor" formControlName="role" value="tutor">
  <label class="form-check-label" for="roleTutor">Tuteur</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="radio" id="roleAdmin" formControlName="role" value="admin">
  <label class="form-check-label" for="roleAdmin">Admin</label>
</div>

    </div>

    <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Enregistrer</button>
  </form>
</div>
