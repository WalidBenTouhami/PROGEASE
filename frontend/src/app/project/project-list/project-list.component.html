<section aria-labelledby="liste-projets-titre">
  <h2 id="liste-projets-titre">Liste des projets</h2>
  <ul class="project-list">
    <li *ngFor="let projet of projets">
      <a [routerLink]="['/projets', projet.id]">{{ projet.nom }}</a>
      <span *ngIf="projet.statut === 'encours'" class="status encours">En cours</span>
      <span *ngIf="projet.statut === 'termine'" class="status termine">Terminé</span>
    </li>
  </ul>
</section>
