<div *ngIf="chargement">Chargement...</div>
<div *ngIf="erreur" class="erreur">{{erreur}}</div>

<table *ngIf="projets.length > 0">
  <thead>
  <tr>
    <th>Titre</th>
    <th>Description</th>
    <th>Statut</th>
    <th>Progression</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let projet of projets">
    <td>{{projet.titre}}</td>
    <td>{{projet.description}}</td>
    <td>{{projet.statut}}</td>
    <td>{{projet.progression || 0}} %</td>
    <td>
      <button type="button" (click)="voirDetails(projet._id)">Détails</button>
    </td>
  </tr>
  </tbody>
</table>
<div *ngIf="projets.length === 0 && !chargement">Aucun projet trouvé.</div>
