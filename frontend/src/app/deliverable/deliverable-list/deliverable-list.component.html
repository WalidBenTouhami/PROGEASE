<section aria-labelledby="deliverable-list-title">
  <h2 id="deliverable-list-title">Liste des livrables</h2>
  <ul class="deliverable-list">
    <li *ngFor="let deliverable of deliverables">
      <a [routerLink]="['/deliverable', deliverable.id]">{{ deliverable.title }}</a>
      <span *ngIf="deliverable.status === 'submitted'" class="status submitted">Soumis</span>
      <span *ngIf="deliverable.status === 'pending'" class="status pending">En attente</span>
    </li>
  </ul>
</section>
