<form (ngSubmit)="soumettreLivrable()" #livrableForm="ngForm" aria-labelledby="formulaire-livrable-titre" class="form-container">
  <h2 id="formulaire-livrable-titre">Ajouter un livrable</h2>
  <div class="form-group">
    <label for="titre">Titre</label>
    <input type="text" id="titre" name="titre" [(ngModel)]="livrable.titre" required aria-required="true" #titreInput="ngModel">
    <div *ngIf="titreInput.invalid && titreInput.touched" class="error">Le titre est requis.</div>
  </div>
  <div class="form-group">
    <label for="fichier">Fichier</label>
    <input type="file" id="fichier" name="fichier" (change)="chargerFichier($event)" required aria-required="true">
  </div>
  <button type="submit" [disabled]="livrableForm.invalid">Soumettre</button>
</form>
