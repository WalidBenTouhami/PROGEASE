<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Connexion</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Adresse e-mail</label>
        <input type="email" class="form-control" id="email" formControlName="email" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" class="form-control" id="password" formControlName="password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Se connecter</button>
        <div class="mt-3 text-center">
            <a routerLink="/signup">Créer un compte</a>
            </div>
    </form>
  </div>
</div>
