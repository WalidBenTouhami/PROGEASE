<section aria-labelledby="liste-livrables-titre">
  <h2 id="liste-livrables-titre">Liste des livrables</h2>
  <ul class="deliverable-list">
    <li *ngFor="let livrable of livrables">
      <a [routerLink]="['/livrables', livrable.id]">{{ livrable.titre }}</a>
      <span *ngIf="livrable.statut === 'soumis'" class="status soumis">Soumis</span>
      <span *ngIf="livrable.statut === 'attente'" class="status attente">En attente</span>
    </li>
  </ul>
</section>
