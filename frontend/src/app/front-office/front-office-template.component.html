    <img src="assets/PROGEASE.png" alt="PROGEASE Logo" class="fo-logo" />
    <span class="fo-title">PROGEASE</span>
    <span class="spacer"></span>
    <a mat-button routerLink="/front-office/dashboard" routerLinkActive="active"><mat-icon>dashboard</mat-icon> Dashboard</a>
    <a mat-button routerLink="/front-office/projets" routerLinkActive="active"><mat-icon>assignment</mat-icon> Projets</a>
    <a mat-button routerLink="/front-office/livrables" routerLinkActive="active"><mat-icon>fact_check</mat-icon> Livrables</a>
