<h2>Liste des projets</h2>

<div *ngIf="chargement">Chargement...</div>
<div *ngIf="erreur" class="erreur">{{ erreur }}</div>

<table *ngIf="projets.length">
  <thead>
  <tr>
    <th>Titre</th>
    <th>Description</th>
    <th>Statut</th>
    <th>Date de debut</th>
    <th>Date de fin</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let projet of projets">
    <td>{{ projet.titre }}</td>
    <td>{{ projet.description }}</td>
    <td>{{ projet.statut }}</td>
    <td>{{ projet.dateDebut | date:'dd/MM/yyyy' }}</td>
    <td>{{ projet.dateFin | date:'dd/MM/yyyy' }}</td>
    <td>
      <button type="button" (click)="voirDetails(projet._id)">Voir</button>
    </td>
  </tr>
  </tbody>
</table>
<div *ngIf="!projets.length && !chargement">Aucun projet trouve.</div>
