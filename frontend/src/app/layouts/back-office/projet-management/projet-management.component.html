<mat-card>
  <h2>Gestion des projets</h2>
  <mat-form-field appearance="outline" style="width: 250px; margin-right: 1rem;">
    <mat-label>Rechercher un projet...</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Titre du projet">
  </mat-form-field>
  <mat-form-field appearance="outline" style="width: 180px;">
    <mat-label>Statut</mat-label>
    <mat-select [(ngModel)]="selectedStatus">
      <mat-option value="">Tous</mat-option>
      <mat-option *ngFor="let status of statuts" [value]="status">{{ status }}</mat-option>
    </mat-select>
  </mat-form-field>

  <table mat-table [dataSource]="projetsFiltres" class="mat-elevation-z2" *ngIf="projetsFiltres.length">
    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let projet">{{ projet.titre }}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let projet">{{ projet.description }}</td>
    </ng-container>
    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let projet">{{ projet.statut }}</td>
    </ng-container>
    <ng-container matColumnDef="dateDebut">
      <th mat-header-cell *matHeaderCellDef>Date de début</th>
      <td mat-cell *matCellDef="let projet">{{ projet.dateDebut | date:'dd/MM/yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="dateFin">
      <th mat-header-cell *matHeaderCellDef>Date de fin</th>
      <td mat-cell *matCellDef="let projet">{{ projet.dateFin | date:'dd/MM/yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let projet">
        <button mat-icon-button color="primary" aria-label="Éditer"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" aria-label="Supprimer"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <p *ngIf="projetsFiltres.length === 0">Aucun projet trouvé.</p>
</mat-card>
