<div class="container mx-auto p-6">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-3xl font-bold mb-6 text-gray-800">Formation Intelligente d'Équipes</h1>
    
    <!-- Section d'ajout de membres -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Ajouter des Membres</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nom du membre</label>
          <input 
            type="text" 
            [(ngModel)]="nouveauMembre.nom"
            placeholder="Nom complet"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Ajouter une compétence</label>
          <div class="flex gap-2">
            <input 
              type="text" 
              [(ngModel)]="competenceInput"
              (keyup.enter)="ajouterCompetence()"
              placeholder="Ex: JavaScript, React, ..."
              class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            />
            <button 
              (click)="ajouterCompetence()"
              class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
            >
              Ajouter
            </button>
          </div>
        </div>
      </div>

      <!-- Liste des compétences -->
      <div class="mb-4" *ngIf="nouveauMembre.competences.length > 0">
        <label class="block text-sm font-medium text-gray-700 mb-2">Compétences:</label>
        <div class="flex flex-wrap gap-2">
          <span 
            *ngFor="let comp of nouveauMembre.competences; let i = index"
            class="inline-flex items-center px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm"
          >
            {{ comp }}
            <button 
              (click)="supprimerCompetence(i)"
              class="ml-2 text-blue-600 hover:text-blue-800"
            >
              ×
            </button>
          </span>
        </div>
      </div>

      <div class="flex gap-4">
        <button 
          (click)="ajouterMembre()"
          [disabled]="!nouveauMembre.nom || nouveauMembre.competences.length === 0"
          class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
        >
          Ajouter le membre
        </button>
        
        <label class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition cursor-pointer">
          Importer depuis JSON
          <input 
            type="file" 
            accept=".json"
            (change)="importerMembres($event)"
            class="hidden"
          />
        </label>
      </div>
    </div>

    <!-- Liste des membres -->
    <div class="mb-8" *ngIf="membres.length > 0">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Membres ({{ membres.length }})</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div 
          *ngFor="let membre of membres; let i = index"
          class="bg-gray-50 border border-gray-200 rounded-lg p-4"
        >
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-semibold text-gray-800">{{ membre.nom }}</h3>
            <button 
              (click)="supprimerMembre(i)"
              class="text-red-500 hover:text-red-700"
            >
              ×
            </button>
          </div>
          <div class="flex flex-wrap gap-1">
            <span 
              *ngFor="let comp of membre.competences"
              class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded"
            >
              {{ comp }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bouton de formation -->
    <div class="mb-8" *ngIf="membres.length >= 2">
      <button 
        (click)="formerEquipes()"
        [disabled]="loading"
        class="w-full px-6 py-3 bg-blue-600 text-white text-lg font-semibold rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        <span *ngIf="!loading">🤖 Former les Équipes avec l'IA</span>
        <span *ngIf="loading">⏳ Formation en cours...</span>
      </button>
    </div>

    <!-- Résultats des équipes -->
    <div *ngIf="equipes.length > 0">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-700">Équipes Formées</h2>
        <button 
          (click)="exporterEquipes()"
          class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition"
        >
          Exporter les résultats
        </button>
      </div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div 
          *ngFor="let equipe of equipes; let i = index"
          class="bg-gradient-to-br from-blue-50 to-indigo-50 border-2 border-blue-200 rounded-lg p-6"
        >
          <div class="flex justify-between items-start mb-4">
            <h3 class="text-lg font-bold text-blue-900">Équipe {{ i + 1 }}</h3>
            <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-semibold">
              Force: {{ equipe.forceEstimee }}/10
            </span>
          </div>
          
          <div class="mb-4">
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Membres:</h4>
            <p class="text-gray-600">{{ getMembresEquipe(equipe.membres) }}</p>
          </div>
          
          <div>
            <h4 class="text-sm font-semibold text-gray-700 mb-2">Compétences principales:</h4>
            <div class="flex flex-wrap gap-2">
              <span 
                *ngFor="let comp of equipe.competencesPrincipales"
                class="px-3 py-1 bg-blue-200 text-blue-900 rounded-full text-sm font-medium"
              >
                {{ comp }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
