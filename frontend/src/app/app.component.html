<a href="#contenu-principal" class="skip-link">Aller au contenu principal</a>
<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <div class="logo-container">
        <img src="assets/PROGEASE.png" alt="Logo PROGEASE" height="45" loading="lazy" />
        <h1>PROGEASE</h1>
      </div>
      <nav class="main-nav" aria-label="Menu principal">
        <ul>
          <li><a routerLink="/front-office" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a></li>
          <li><a routerLink="/front-office/formations" routerLinkActive="active">Formations</a></li>
          <li><a routerLink="/projets" routerLinkActive="active">Projets</a></li>
          <li><a routerLink="/livrables" routerLinkActive="active">Livrables</a></li>
          <li><a routerLink="/back-office" routerLinkActive="active">Administration</a></li>
          <li>
            <div class="auth-buttons">
              <ng-container *ngIf="!isAuthenticated; else loggedIn">
                <a class="btn btn-outline-primary" routerLink="/login">Se connecter</a>
              </ng-container>
              <ng-template #loggedIn>
                <span class="welcome-msg">Bienvenue, {{ userName }}</span>
                <button class="btn btn-outline-danger" (click)="auth.logout()">Déconnexion</button>
              </ng-template>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenu-principal" class="app-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>&copy; 2025 PROGEASE – Plateforme de gestion de projets académiques</p>
  </footer>
</div>
