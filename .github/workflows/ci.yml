name: PROGEASE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0
        ports: [27017:27017]
    env:
      MONGODB_URI: mongodb://localhost:27017/progease
      NODE_ENV: test
      PORT: 5000
      CORS_ORIGINS: http://localhost:3000
      GRAPHQL_URL: http://localhost:5000/graphql
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # Vérification de la sécurité des dépendances
      - name: Security audit backend
        env:
          MONGOMS_DISABLE_POSTINSTALL: 1
          MONGOMS_SKIP_DOWNLOAD: 1
        run: |
          cd backend
          npm audit --production
          npm audit fix || true

      - name: Security audit frontend
        env:
          MONGOMS_DISABLE_POSTINSTALL: 1
          MONGOMS_SKIP_DOWNLOAD: 1
        run: |
          cd frontend
          npm audit --production
          npm audit fix || true

      # Installation des dépendances
      - name: Install backend dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: 1
          MONGOMS_SKIP_DOWNLOAD: 1
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: 1
          MONGOMS_SKIP_DOWNLOAD: 1
        run: |
          cd frontend
          npm ci

      # Vérification du formatage du code
      - name: Check code formatting backend
        run: |
          cd backend
          npm run format:check || true

      - name: Check code formatting frontend
        run: |
          cd frontend
          npm run format:check || true

      # Linting
      - name: Lint backend
        run: |
          cd backend
          npm run lint

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      # Build
      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # Tests avec couverture
      - name: Run backend tests with coverage
        run: |
          cd backend
          npm test -- --coverage

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless --coverage

      # Upload des rapports de couverture
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage/
            frontend/coverage/

      # Démarrage du backend pour les tests d'intégration
      - name: Start backend (in background)
        run: |
          cd backend
          npm run start &
          sleep 15  # Augmenté à 15 secondes pour plus de fiabilité

      # Tests d'intégration et génération de docs
      - name: Generate and validate backend tests/docs
        run: |
          cd backend
          node tools/test-generator.js --graphql
          node tools/test-generator.js --validate-graphql
          node tools/test-generator.js --rest
          node tools/test-generator.js --validate-rest
          node tools/test-generator.js --docs

      # Upload des artefacts
      - name: Upload API docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: backend/docs/

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/reports/

      # Déploiement conditionnel (uniquement sur main)
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Déploiement en production..."
          # Ajoutez ici vos commandes de déploiement
          # Par exemple:
          # - Configuration des secrets
          # - Déploiement sur votre plateforme (Heroku, AWS, etc.)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # Ajoutez d'autres variables d'environnement nécessaires

      # Installation des dépendances supplémentaires
      - name: Install additional dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: 1
          MONGOMS_SKIP_DOWNLOAD: 1
        run: |
          cd frontend
          npm install --save-dev @graphql-codegen/introspection
          npm install @angular/material @angular/cdk 