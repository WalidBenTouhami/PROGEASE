name: PROGEASE CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0
        ports: [27017:27017]
    env:
      MONGO_URI: mongodb://localhost:27017/progease
      NODE_ENV: test
      PORT: 5000
      CORS_ORIGINS: http://localhost:3000
      GRAPHQL_URL: http://localhost:5000/graphql
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint backend
        run: |
          cd backend
          npm run lint || true

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build --if-present

      - name: Start backend (in background)
        run: |
          cd backend
          npm run start &
          sleep 10

      - name: Run backend tests
        run: |
          cd backend
          npm test

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Generate and validate backend tests/docs
        run: |
          cd backend
          node tools/test-generator.js --graphql
          node tools/test-generator.js --validate-graphql
          node tools/test-generator.js --rest
          node tools/test-generator.js --validate-rest
          node tools/test-generator.js --docs

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: api-docs
          path: backend/docs/

      - name: Upload test reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: backend/reports/

      - name: Install additional dependencies
        run: |
          cd frontend
          npm install --save-dev @graphql-codegen/introspection 