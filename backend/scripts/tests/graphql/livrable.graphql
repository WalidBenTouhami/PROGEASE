query GetAllLivrables {
  livrables {
    _id
    titre
    description
    statut
    dateEcheance
    projetId
  }
}

query GetLivrableById($id: ID!) {
  livrable(id: $id) {
    _id
    titre
    description
    statut
    dateEcheance
    projetId
    projet {
      _id
      titre
    }
  }
}

