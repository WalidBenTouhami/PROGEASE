query GetAllProjets {
  projets {
    _id
    titre
    description
    statut
    dateDebut
    dateFin
  }
}

query GetProjetById($id: ID!) {
  projet(id: $id) {
    _id
    titre
    description
    statut
    dateDebut
    dateFin
    livrables {
      _id
      titre
      statut
    }
  }
}

