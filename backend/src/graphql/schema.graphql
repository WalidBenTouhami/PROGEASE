# Directive pour la fédération Apollo v2
extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

# Enumération pour les statuts des livrables
extend enum StatutLivrable {
  PLANIFIE
  EN_COURS
  A_VALIDER
  VALIDE
  REJETE
}

# Type Livrable
type Livrable {
  _id: ID!
  nom: String!
  description: String!
  dateLimite: String!
  urlDepot: String!
  statut: StatutLivrable!
  projetId: ID!
  creeLe: String
  majLe: String
}

# Type d'entrée pour Livrable
input LivrableInput {
  nom: String!
  description: String!
  dateLimite: String!
  urlDepot: String!
  statut: StatutLivrable!
}

# Type Projet avec directive de fédération
type Projet @key(fields: "_id") {
  _id: ID!
  titre: String!
  description: String!
  equipe: [ID!]!
  tuteur: ID
  competences: [String!]!
  dateDebut: String!
  dateFin: String!
  livrables: [Livrable!]!
  statut: String!
  progression: Int
  creeLe: String
  majLe: String
}

# Type Query
type Query {
  projets: [Projet!]!
  projet(id: ID!): Projet
  livrables(projetId: ID!): [Livrable!]!
  livrable(id: ID!): Livrable
}

# Type Mutation
type Mutation {
  creerProjet(
    titre: String!
    description: String!
    equipe: [ID!]!
    tuteur: ID
    competences: [String!]!
    dateDebut: String!
    dateFin: String!
    statut: String
  ): Projet

  mettreAJourProjet(
    id: ID!
    titre: String
    description: String
    equipe: [ID!]
    tuteur: ID
    competences: [String!]
    dateDebut: String
    dateFin: String
    statut: String
  ): Projet

  supprimerProjet(id: ID!): Projet

  ajouterLivrable(projetId: ID!, input: LivrableInput!): Livrable
  mettreAJourLivrable(livrableId: ID!, input: LivrableInput!): Livrable
  supprimerLivrable(livrableId: ID!): Livrable
}