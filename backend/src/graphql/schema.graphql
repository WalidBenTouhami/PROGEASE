# Directives pour la fédération Apollo v2
directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE
directive @shareable repeatable on FIELD_DEFINITION | OBJECT
directive @external on FIELD_DEFINITION
directive @requires(fields: String!) on FIELD_DEFINITION
directive @provides(fields: String!) on FIELD_DEFINITION
directive @tag(
    name: String!
) on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ARGUMENT_DEFINITION | SCALAR | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Scalar personnalisé pour manipuler les dates ISO-8601
"""
scalar Date

"""
Type représentant un projet
"""
type Projet {
    """Identifiant unique du projet"""
    _id: ID!
    """Titre du projet"""
    titre: String!
    """Description du projet"""
    description: String
    """Liste des membres de l'équipe projet"""
    equipe: [String]
    """Tuteur du projet"""
    tuteur: String
    """Liste des compétences requises"""
    competences: [String]
    """Date de début du projet"""
    dateDebut: Date
    """Date de fin prévue du projet"""
    dateFin: Date
    """Liste des livrables associés au projet"""
    livrables: [ID]
    """Statut actuel du projet"""
    statut: String
    """Pourcentage de progression du projet"""
    progression: Int
    """Date de création du projet"""
    creeLe: Date
    """Date de dernière modification du projet"""
    majLe: Date
}

"""
Type représentant un livrable
"""
type Livrable {
    """Identifiant unique du livrable"""
    _id: ID!
    """Titre du livrable (principal)"""
    intitule: String!
    """Alias pour le titre (compatibilité)"""
    titre: String
    """Alias pour le titre (compatibilité)"""
    nom: String
    """Description du livrable"""
    description: String
    """Date limite de remise"""
    dateLimite: Date
    """Alias pour la date limite (compatibilité)"""
    dateEcheance: Date
    """URL de dépôt du livrable"""
    urlDepot: String
    """Statut actuel du livrable"""
    statut: String
    """Projet associé au livrable"""
    projetId: ID!
    """Date de création du livrable"""
    creeLe: Date
    """Date de dernière modification du livrable"""
    majLe: Date
}

"""
Input pour la création d'un projet
"""
input ProjetInput {
    """Titre du projet"""
    titre: String!
    """Description du projet"""
    description: String
    """Liste des membres de l'équipe projet"""
    equipe: [String]
    """Tuteur du projet"""
    tuteur: String
    """Liste des compétences requises"""
    competences: [String]
    """Date de début du projet"""
    dateDebut: Date
    """Date de fin prévue du projet"""
    dateFin: Date
}

"""
Input pour la création d'un livrable
"""
input LivrableInput {
    """Titre du livrable"""
    intitule: String!
    """Description du livrable"""
    description: String
    """Date limite de remise"""
    dateEcheance: Date
    """URL de dépôt du livrable"""
    urlDepot: String
    """Statut actuel du livrable"""
    statut: String
    """Projet associé au livrable"""
    projetId: ID!
}

"""
Résultat de l'analyse IA
"""
type AnalyseIA {
    """Sentiment général"""
    sentiment: String
    """Score de sentiment (entre -1 et 1)"""
    score: Float
    """Entités détectées"""
    entites: [String]
    """Mots-clés identifiés"""
    motsCles: [String]
    """Résumé du contenu"""
    resume: String
}

type Query {
    """Récupérer tous les projets"""
    projets: [Projet]
    """Récupérer un projet par son ID"""
    projet(id: ID!): Projet
    """Récupérer tous les livrables"""
    livrables: [Livrable]
    """Récupérer un livrable par son ID"""
    livrable(id: ID!): Livrable
    """Récupérer les livrables d'un projet"""
    livrablesByProjet(projetId: ID!): [Livrable]
}

type Mutation {
    """Créer un nouveau projet"""
    creerProjet(input: ProjetInput!): Projet
    """Mettre à jour un projet existant"""
    mettreAJourProjet(id: ID!, input: ProjetInput!): Projet
    """Supprimer un projet"""
    supprimerProjet(id: ID!): Projet
    """Créer un nouveau livrable"""
    creerLivrable(input: LivrableInput!): Livrable
    """Mettre à jour un livrable existant"""
    mettreAJourLivrable(id: ID!, input: LivrableInput!): Livrable
    """Supprimer un livrable"""
    supprimerLivrable(id: ID!): Livrable
}