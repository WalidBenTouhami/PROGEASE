# Requête pour récupérer tous les healths
query GetAllHealths {
  health {
    _id
    status
    timestamp
    user
    version
    uptime
  }
}

# Requête pour récupérer un health spécifique
query GetHealthById($id: ID!) {
  health(id: $id) {
    _id
    status
    timestamp
    user
    version
    uptime
  }
}

