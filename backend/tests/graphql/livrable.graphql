# Requête pour récupérer tous les livrables
query GetAllLivrables {
  livrable {
    _id
    _id
    intitule
    titre
    nom
    description
    dateEcheance
    dateLimite
    urlDepot
    statut
    projetId
    creeLe
    majLe
  }
}

# Requête pour récupérer un livrable spécifique
query GetLivrableById($id: ID!) {
  livrable(id: $id) {
    _id
    _id
    intitule
    titre
    nom
    description
    dateEcheance
    dateLimite
    urlDepot
    statut
    projetId
    creeLe
    majLe
  }
}

