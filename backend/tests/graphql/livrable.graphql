# Mutation pour créer un livrable
mutation CreateLivrable($input: LivrableInput!) {
  createLivrable(input: $input) {
    _id
    _id
    intitule
    titre
    nom
    description
    dateEcheance
    dateLimite
    urlDepot
    statut
    projetId
    creeLe
    majLe
  }
}

