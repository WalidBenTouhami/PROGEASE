# Mutation pour mettre à jour un livrable
mutation UpdateLivrable($id: ID!, $input: LivrableInput!) {
  updateLivrable(id: $id, input: $input) {
    _id
    _id
    intitule
    titre
    nom
    description
    dateEcheance
    dateLimite
    urlDepot
    statut
    projetId
    creeLe
    majLe
  }
}

