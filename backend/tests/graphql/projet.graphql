# Mutation pour mettre à jour un projet
mutation UpdateProjet($id: ID!, $input: ProjetInput!) {
  updateProjet(id: $id, input: $input) {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

