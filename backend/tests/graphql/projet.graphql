# Mutation pour créer un projet
mutation CreateProjet($input: ProjetInput!) {
  createProjet(input: $input) {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

