# Requête pour récupérer tous les projets
query GetAllProjets {
  projet {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

# Requête pour récupérer un projet spécifique
query GetProjetById($id: ID!) {
  projet(id: $id) {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

