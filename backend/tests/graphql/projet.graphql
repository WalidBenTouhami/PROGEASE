# Requete pour recuperer tous les projets
query GetAllProjets {
  projet {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

# Requete pour recuperer un projet specifique
query GetProjetById($id: ID!) {
  projet(id: $id) {
    _id
    _id
    titre
    description
    tuteur
    dateDebut
    dateFin
    statut
    progression
    creeLe
    majLe
  }
}

