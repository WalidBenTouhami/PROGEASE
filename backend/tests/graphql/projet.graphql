# Requete pour recuperer tous les projets avec pagination
query GetAllProjets($page: Int, $limit: Int, $statut: StatutProjet, $recherche: String) {
  projets(page: $page, limit: $limit, statut: $statut, recherche: $recherche) {
    items {
      _id
      titre
      description
      equipe
      tuteur
      competences
      dateDebut
      dateFin
      livrables {
        _id
        intitule
        statut
        dateLimite
        estEnRetard
      }
      statut
      urlDepot
      progression
      creeLe
      majLe
      duree
      estEnRetard
    }
    pagination {
      total
      pages
      page
      limit
      hasNextPage
      hasPreviousPage
    }
  }
}

# Requete pour recuperer un projet specifique
query GetProjetById($id: ID!) {
  projet(id: $id) {
    _id
    titre
    description
    equipe
    tuteur
    competences
    dateDebut
    dateFin
    livrables {
      _id
      intitule
      description
      dateLimite
      statut
      urlDepot
      estEnRetard
    }
    statut
    urlDepot
    progression
    creeLe
    majLe
    duree
    estEnRetard
  }
}

# Analyser les risques d'un projet
query AnalyserRisquesProjet($projetId: ID!) {
  analyserRisquesProjet(projetId: $projetId) {
    retard
    progression
    livrables
    equipe
    niveauRisque
    recommandations
  }
}

# Mutation pour créer un projet
mutation CreerProjet($input: ProjetInput!) {
  creerProjet(input: $input) {
    _id
    titre
    description
    equipe
    tuteur
    competences
    dateDebut
    dateFin
    statut
    urlDepot
    progression
    creeLe
    majLe
  }
}

# Mutation pour mettre à jour un projet
mutation MettreAJourProjet($id: ID!, $input: ProjetUpdateInput!) {
  mettreAJourProjet(id: $id, input: $input) {
    _id
    titre
    description
    equipe
    tuteur
    competences
    dateDebut
    dateFin
    statut
    urlDepot
    progression
    majLe
  }
}

# Mutation pour supprimer un projet
mutation SupprimerProjet($id: ID!) {
  supprimerProjet(id: $id) {
    _id
    titre
    statut
  }
}

