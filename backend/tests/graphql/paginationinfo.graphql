# Exemple de requete paginee pour les projets
query GetPaginatedProjets($page: Int, $limit: Int) {
  projets(page: $page, limit: $limit) {
    items {
      _id
      titre
      statut
    }
    pagination {
      total
      pages
      page
      limit
      hasNextPage
      hasPreviousPage
    }
  }
}

# Exemple de requete paginee pour les livrables
query GetPaginatedLivrables($page: Int, $limit: Int) {
  livrables(page: $page, limit: $limit) {
    items {
      _id
      intitule
      statut
    }
    pagination {
      total
      pages
      page
      limit
      hasNextPage
      hasPreviousPage
    }
  }
}

# Variables d'exemple:
# {
#   "page": 1,
#   "limit": 10
# }
